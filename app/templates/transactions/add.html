{% extends "base.html" %}

{% block title %}Add Transaction - FinanceTracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="m-0 font-weight-bold text-primary">Add New Transaction</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('transactions.add') }}" class="needs-validation" novalidate>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="transaction_type" class="form-label">Transaction Type</label>
                            <select class="form-select" id="transaction_type" name="transaction_type" required>
                                <option value="" selected disabled>Select Type...</option>
                                <option value="Income">Income</option>
                                <option value="Expense">Expense</option>
                                <option value="Received">Money Received</option>
                                <option value="Sent">Money Sent</option>
                            </select>
                            <div class="invalid-feedback">Please choose a transaction type.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" selected disabled>Choose Category...</option>
                            </select>
                            <div class="invalid-feedback">Please choose a category.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount" required>
                            </div>
                            <div class="invalid-feedback">Please enter a valid positive amount.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="transaction_date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="transaction_date" name="transaction_date" value="{{ today }}" required>
                            <div class="invalid-feedback">Please select a date.</div>
                        </div>
                        <div class="col-md-12">
                            <label for="description" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('transactions.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
