{% extends "base.html" %}

{% block title %}Edit Transaction - FinanceTracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="m-0 font-weight-bold text-primary">Edit Transaction</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('transactions.edit', transaction_id=transaction.id) }}" class="needs-validation" novalidate>
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="transaction_type" class="form-label">Transaction Type</label>
                            <select class="form-select" id="transaction_type" name="transaction_type" required>
                                <option value="Income" {% if transaction.transaction_type == 'Income' %}selected{% endif %}>Income</option>
                                <option value="Expense" {% if transaction.transaction_type == 'Expense' %}selected{% endif %}>Expense</option>
                                <option value="Received" {% if transaction.transaction_type == 'Received' %}selected{% endif %}>Money Received</option>
                                <option value="Sent" {% if transaction.transaction_type == 'Sent' %}selected{% endif %}>Money Sent</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" name="category" value="{{ transaction.category }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ transaction.amount }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="transaction_date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="transaction_date" name="transaction_date" value="{{ transaction.transaction_date }}" required>
                        </div>
                        <div class="col-md-12">
                            <label for="description" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ transaction.description }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('transactions.index') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
